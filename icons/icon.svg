<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#1c2521"/>

  <!-- 大盤: 3x3 の太い格子 -->
  <g stroke="#eef1ea" stroke-width="15" stroke-linecap="round" opacity="0.85">
    <line x1="194.7" y1="72" x2="194.7" y2="440"/>
    <line x1="317.3" y1="72" x2="317.3" y2="440"/>
    <line x1="72" y1="194.7" x2="440" y2="194.7"/>
    <line x1="72" y1="317.3" x2="440" y2="317.3"/>
  </g>

  <!-- 左上のマス: 大きな × -->
  <g stroke="#eef1ea" stroke-width="20" stroke-linecap="round">
    <line x1="88" y1="88" x2="176" y2="176"/>
    <line x1="176" y1="88" x2="88" y2="176"/>
  </g>

  <!-- 右下のマス: 大きな ○ -->
  <circle cx="379" cy="379" r="43" fill="none" stroke="#f1cd6a" stroke-width="20"/>

  <!-- 真ん中のマス: 小さな 3x3 の格子 -->
  <g stroke="#eef1ea" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="235.5" y1="194.7" x2="235.5" y2="317.3"/>
    <line x1="276.5" y1="194.7" x2="276.5" y2="317.3"/>
    <line x1="194.7" y1="235.5" x2="317.3" y2="235.5"/>
    <line x1="194.7" y1="276.5" x2="317.3" y2="276.5"/>
  </g>

  <!-- 真ん中のマスの中の小さな × と ○ -->
  <g stroke="#eef1ea" stroke-width="7" stroke-linecap="round">
    <line x1="204" y1="204" x2="222.7" y2="222.7"/>
    <line x1="222.7" y1="204" x2="204" y2="222.7"/>
  </g>
  <circle cx="298.7" cy="298.7" r="11" fill="none" stroke="#f1cd6a" stroke-width="7"/>
</svg>
